name: car_price_app

services:
  price-predict:
    image: car-price-service:2
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models:ro
  
  requests:
    image: car-price-requests:1
    depends_on:
      - price-predict
    deploy:
      replicas: 2
      restart_policy:
        condition: always
        delay: 5s
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    hostname: prometheus
    depends_on:
      - price-predict
  
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
